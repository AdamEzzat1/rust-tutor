[[fixture]]
name = "fit_order-swapped-axes"
stage = 1
hole = "fit_order"
bug = "regresses ln h on ln e: returns 1/p"
body = '''
if hs.len() != errs.len() || hs.len() < 2 {
    return None;
}
if hs.iter().chain(errs).any(|v| !(v.is_finite() && *v > 0.0)) {
    return None;
}
let n = hs.len() as f64;
let mx = hs.iter().map(|h| h.ln()).sum::<f64>() / n;
let mz = errs.iter().map(|e| e.ln()).sum::<f64>() / n;
let mut sxz = 0.0;
let mut sxx = 0.0;
for (h, e) in hs.iter().zip(errs) {
    let dz = e.ln() - mz;
    sxz += (h.ln() - mx) * dz;
    sxx += dz * dz;
}
if sxx == 0.0 {
    return None;
}
Some(sxz / sxx)
'''

[[fixture]]
name = "dopri_step-ignores-nodes"
stage = 2
hole = "dopri_step"
bug = "evaluates every stage at t instead of t + c_i h"
body = '''
use tableau::{A, B5, E};
let Workspace { k, ytmp, ynew, err } = ws;
f(t, y, &mut k[0]);
for s in 1..7 {
    // Stages 0..s are read while stage s is written: split the array.
    let (done, rest) = k.split_at_mut(s);
    ytmp.copy_from_slice(y);
    for (j, kj) in done.iter().enumerate() {
        let a = h * A[s][j];
        for (t, kv) in ytmp.iter_mut().zip(kj) {
            *t += a * kv;
        }
    }
    f(t, ytmp, &mut rest[0]);
}
// Stage-major accumulation: the inner loop walks each k_j with unit stride.
ynew.copy_from_slice(y);
err.fill(0.0);
for (j, kj) in k.iter().enumerate() {
    let (b, e) = (h * B5[j], h * E[j]);
    for ((yn, er), kv) in ynew.iter_mut().zip(err.iter_mut()).zip(kj) {
        *yn += b * kv;
        *er += e * kv;
    }
}
'''


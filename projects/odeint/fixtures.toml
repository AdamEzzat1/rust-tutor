# Explain fixtures: one realistic bug per hole (plus a compile error), put
# into the reference at the given stage. `tutor fixtures odeint --check`
# re-runs explain on each and compares with fixtures/<name>.golden.txt.
# Each fixture's explain output must start at its own hole.

[[fixture]]
name = "lincomb-forgets-h"
stage = 1
hole = "lincomb"
bug = "forgets to multiply the combination by h"
body = '''
assert_eq!(out.len(), y.len(), "lincomb: out and y differ in length");
for (_, k) in terms {
    assert_eq!(k.len(), out.len(), "lincomb: a term differs in length");
}
for (i, o) in out.iter_mut().enumerate() {
    let mut acc = 0.0;
    for (c, k) in terms {
        acc += c * k[i];
    }
    *o = y[i] + acc;
}
'''

[[fixture]]
name = "rk4_step-stale-stage"
stage = 1
hole = "rk4_step"
bug = "builds the third stage from k1 instead of k2"
body = '''
let [k1, k2, k3, k4, ..] = &mut ws.k;
let tmp = &mut ws.ytmp;
f(t, y, k1);
lincomb(tmp, y, h, &[(0.5, k1)]);
f(t + 0.5 * h, tmp, k2);
lincomb(tmp, y, h, &[(0.5, k1)]);
f(t + 0.5 * h, tmp, k3);
lincomb(tmp, y, h, &[(1.0, k3)]);
f(t + h, tmp, k4);
for i in 0..y.len() {
    y[i] += h * (k1[i] + 2.0 * k2[i] + 2.0 * k3[i] + k4[i]) / 6.0;
}
'''

